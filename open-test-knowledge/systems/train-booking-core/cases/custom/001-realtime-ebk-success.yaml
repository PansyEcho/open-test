schema_version: opentest.variant/v2alpha1
variant_id: variant:core-order-lifecycle:001-realtime-ebk-success
suite_id: suite:train-booking-core:core-order-lifecycle-v2
system_id: train-booking-core
category_id: realtime-distribution-success
title: 境内普通EBK实时分单并出票成功
business_goal: 从真实创单入口验证EBK实时分单成功，随后完成出票回填。
priority: P0
lifecycle: blocked
missing_conditions: [qa_domestic_ebk_realtime_fixture, valid_issue_request, confirmed_realtime_nonempty_merchant, oracle_catalog_snapshot, cleanup_capability]
source_scan_id: scan-20260811091050-dc8391e426-0a843ec3
source_refs: [{path: app/biz/src/main/java/com/ly/travel/train/supplychain/bookingcore/biz/manager/trade/CreateOrderServiceInvoker.java, symbol: 'CreateOrderServiceInvoker#invokeInner'}, {path: app/biz/src/main/java/com/ly/travel/train/supplychain/bookingcore/biz/manager/ticket/IssueTicketServiceInvoker.java, symbol: IssueTicketServiceInvoker}]
fixture_requirements: [{fixture_id: 'fixture:realtime:domestic-ebk', purpose: 提供可实时分到EBK且可出票的完整创单和出票请求}]
fixed_execution_order: [execute-create, assert-create, observe-ticketing, observe-collection, execute-issue, assert-issue, observe-order, observe-items, observe-redis-done, observe-mq-effect]
steps:
- step_id: execute-create
  action: execute
  tool_id: facade.trade.create_order
  input: {request: '${fixtures.domestic_ebk.create_request}'}
- step_id: assert-create
  action: assert
  assertions:
    $.success: true
    $.response.success: true
    $.response.code: 200
    $.response.result.createResult: true
    $.response.result.orderSerialId: {op: not_null}
    $.response.result.transactionId: {op: not_null}
    $.response.result.supplierId: {op: not_null}
- step_id: observe-ticketing
  action: oracle
  oracle: {kind: MYSQL, resource_id: 'resource:train-booking-core:mysql:database:bookingcoredatasource', operation_id: order.primary_detail, evidence_mode: DIRECT}
  input:
    order_serial_no: '${steps.execute-create.output.response.result.orderSerialId}'
    transaction_serial_no: '${steps.execute-create.output.response.result.transactionId}'
  assertions:
    rowCount: 1
    rows[0].orderSerialNo: '${steps.execute-create.output.response.result.orderSerialId}'
    rows[0].transactionSerialNo: '${steps.execute-create.output.response.result.transactionId}'
    rows[0].orderState: 5
    rows[0].merchantType: 1
    rows[0].merchantId: {op: not_null}
    rows[0].ticketMachineId: '${steps.execute-create.output.response.result.supplierId}'
    rows[0].occupyType: 0
    rows[0].connectType: 0
    rows[0].deleted: 0
    rows[0].environment: qa
- step_id: observe-collection
  action: oracle
  oracle: {kind: MYSQL, resource_id: 'resource:train-booking-core:mysql:database:temporderdatasource', operation_id: collection.detail, evidence_mode: DIRECT}
  input: {order_serial_no: '${steps.execute-create.output.response.result.orderSerialId}'}
  assertions: {rowCount: 0, rows: []}
- step_id: execute-issue
  action: execute
  tool_id: facade.ticket.issue_ticket
  input:
    request_base: '${fixtures.domestic_ebk.issue_request}'
    request_overrides:
      serialId: '${steps.execute-create.output.response.result.orderSerialId}'
      transactionSerialNo: '${steps.execute-create.output.response.result.transactionId}'
- step_id: assert-issue
  action: assert
  assertions:
    $.success: true
    $.response.success: true
    $.response.code: 200
    $.response.result.success: true
    $.response.result.msgCode: 106100
- step_id: observe-order
  action: oracle
  oracle: {kind: MYSQL, resource_id: 'resource:train-booking-core:mysql:database:bookingcoredatasource', operation_id: order.primary_detail, evidence_mode: DIRECT}
  input:
    order_serial_no: '${steps.execute-create.output.response.result.orderSerialId}'
    transaction_serial_no: '${steps.execute-create.output.response.result.transactionId}'
  assertions:
    rowCount: 1
    rows[0].orderSerialNo: '${steps.execute-create.output.response.result.orderSerialId}'
    rows[0].transactionSerialNo: '${steps.execute-create.output.response.result.transactionId}'
    rows[0].orderState: 6
    rows[0].merchantType: 1
    rows[0].merchantId: {op: not_null}
    rows[0].ticketMachineId: '${steps.execute-create.output.response.result.supplierId}'
    rows[0].occupyType: 0
    rows[0].connectType: 0
    rows[0].deleted: 0
    rows[0].environment: qa
- step_id: observe-items
  action: oracle
  oracle: {kind: MYSQL, resource_id: 'resource:train-booking-core:mysql:database:bookingcoredatasource', operation_id: order.items_by_transaction, evidence_mode: DIRECT}
  input: {transaction_serial_no: '${steps.execute-create.output.response.result.transactionId}'}
  assertions:
    rowCount: '${fixtures.domestic_ebk.expected_passenger_count}'
    rows:
      op: rows_unordered_match
      value:
        expected_rows: '${fixtures.domestic_ebk.expected_issue_items}'
        common_fields:
          orderSerialNo: '${steps.execute-create.output.response.result.orderSerialId}'
          transactionSerialNo: '${steps.execute-create.output.response.result.transactionId}'
          deleted: 0
          environment: qa
        non_null_fields: [itemId]
- step_id: observe-redis-done
  action: oracle
  oracle: {kind: REDIS, resource_id: 'resource:train-booking-core:redis:cache:redissionproxy', operation_id: redis.order_done_status, evidence_mode: DIRECT}
  input:
    order_serial_no: '${steps.execute-create.output.response.result.orderSerialId}'
    transaction_serial_no: '${steps.execute-create.output.response.result.transactionId}'
  assertions: {exists: true, ttlSeconds: {op: gt, value: 0}}
- step_id: observe-mq-effect
  action: oracle
  oracle: {kind: MQ, resource_id: 'resource:train-booking-core:mq:consumer:jobmessagelistener', operation_id: mq.trace_match, evidence_mode: EFFECT_ONLY}
  input: {trace_id: '${steps.execute-create.output.response.result.orderSerialId}'}
  assertions: {directVerified: false, evidenceMode: downstream_effect_only}
expected_business_outcome: {response: accepted, merchant_type: EBK, state_path: 'INIT -> TICKETING -> ISSUE_SUCCESS'}
cleanup_policy: {mode: EXTERNAL_FIXTURE_OWNER, key: '${steps.execute-create.output.response.result.orderSerialId}'}
