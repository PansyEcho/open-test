[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-test"
version = "0.2.0"
description = "Local agent-driven business knowledge and regression testing platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.12,<3",
  "PyYAML>=6,<7",
  "uvicorn>=0.41,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]
qa = ["PyMySQL>=1.1,<2", "redis>=5,<8"]

[project.scripts]
opentest = "opentest.cli:main"

[tool.setuptools.packages.find]
include = ["opentest*"]

[tool.setuptools.package-data]
opentest = ["web/*.html", "web/*.css", "web/*.js", "assets/*.yaml", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
